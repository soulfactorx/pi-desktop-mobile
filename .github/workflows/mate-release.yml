# Pi Desktop Mate 릴리스: mate-v로 시작하는 태그(예: mate-v0.1.0)를 올리면 세 OS 설치 파일을 만들어 GitHub Releases에 올린다.
#   git tag -a mate-v0.1.0 -m "Pi Desktop Mate v0.1.0" && git push origin mate-v0.1.0
# Actions 탭에서 손으로 돌리면(workflow_dispatch) 세 OS에서 만들기만 하고 올리지 않는다 (릴리스 전 미리 확인).
#
# Pi Desktop(release.yml, v* 태그)과 섞이지 않게 한다 (설계 DESIGN-MATE.md §0):
# - 태그 이름이 달라 서로의 워크플로를 깨우지 않는다 ("v*"는 mate-v…와 맞지 않음)
# - Mate 릴리스는 "Latest"로 표시하지 않는다. Pi Desktop의 자동 업데이트는 Latest 릴리스의 latest.yml을 보기 때문이다
# - Mate 자동 업데이트용 latest.yml·latest-linux.yml과 blockmap을 함께 올린다. 앱은 릴리스 목록에서 가장 높은 mate-v*를 찾아
#   그 릴리스의 내려받기 주소에서 읽으므로, Pi Desktop의 latest.yml(Latest 릴리스)과 섞이지 않는다
# 코드 서명은 하지 않는다.
name: Mate Release

on:
  push:
    tags: ["mate-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 빌드 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 앱 버전을 태그에 맞추기
        if: startsWith(github.ref, 'refs/tags/mate-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#mate-v}" --no-git-tag-version --allow-same-version -w @pi-desktop/mate

      - name: 설치 파일 만들기
        run: npm run dist -w @pi-desktop/mate

      - name: 결과물 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: mate-release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/mate/release/*.exe
            apps/mate/release/*.dmg
            apps/mate/release/*.AppImage
            apps/mate/release/*.deb
            apps/mate/release/*.blockmap
            apps/mate/release/latest*.yml

  publish:
    name: GitHub Releases에 올리기
    needs: build
    if: startsWith(github.ref, 'refs/tags/mate-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 릴리스 만들기 (Latest로 표시하지 않음)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pi Desktop Mate ${GITHUB_REF_NAME#mate-}" \
            --notes "Pi Desktop Mate 설치 파일입니다. Pi Desktop과 별도 앱입니다. v0.3.0부터 앱 안에서 자동 업데이트됩니다(Windows·AppImage, macOS는 새 버전을 알림). 설명: apps/mate/README.md" \
            --latest=false
