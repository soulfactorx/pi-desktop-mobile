# Pi Desktop Agent 설치 파일 만들기 (설계 DESIGN-AGENT.md §0 "릴리스").
# 로컬: npm run dist -w @pi-desktop/agent   (지금 OS용, 올리지 않음)
# 릴리스: agent-v로 시작하는 태그를 올리면 .github/workflows/release-agent.yml이 세 OS에서 만들어
#        이 저장소(pi-desktop)의 GitHub Releases에 올린다. Latest로 표시하지 않아 Pi Desktop의 v* 릴리스와 섞이지 않는다.
appId: dev.pi-desktop.agent
productName: Pi Desktop Agent
copyright: Copyright © skax-soulfactor

directories:
  output: release
  buildResources: build

# 설치본의 package.json 이름. 워크스페이스 이름(@pi-desktop/agent) 대신 써서 앱 데이터 폴더 이름 등이 깔끔하다.
extraMetadata:
  name: pi-desktop-agent
  desktopName: pi-desktop-agent.desktop

# electron-vite가 만든 결과물만 담는다. 화면(React 등)과 워크스페이스 패키지는 이미 번들에 들어 있다.
files:
  - out/**
  - package.json

extraResources:
  # Host Agent는 앱 밖의 node로 도는 파일이라 asar에 넣지 않는다 (Pi Desktop과 같은 번들)
  - from: ../../packages/host-agent/dist/host-agent.mjs
    to: host-agent/host-agent.mjs
  - from: ../../packages/host-agent/package.json
    to: host-agent/package.json
  # agent-kit은 Pi가 jiti로 불러오는 TypeScript 확장이라 소스 그대로 싣는다.
  # npm 의존성이 없고(typebox·pi-ai는 Pi가 넣어 준다) 테스트는 뺀다.
  - from: ../../packages/agent-kit
    to: agent-kit
    filter:
      - package.json
      - src/**
      - extensions/**
  # pi-isolation: 앱 홈의 mcp.json·AGENTS.md를 읽는 확장. agent-kit과 같은 이유로 소스 그대로 싣는다
  - from: ../../packages/pi-isolation
    to: pi-isolation
    filter:
      - package.json
      - src/**
      - extensions/**
  # Linux 창 아이콘. 실행 파일에 아이콘이 없어 창에 직접 준다.
  - from: build/icon.png
    to: icon.png

npmRebuild: false

# 자동 업데이트(설계 DESIGN-AGENT.md §0): latest.yml(Windows)·latest-linux.yml(AppImage)과 blockmap을 만들게 한다.
# 앱은 릴리스 목록에서 가장 높은 agent-v* 태그를 찾아 그 내려받기 주소를 generic 방식으로 쓴다 (Latest 릴리스를 보지 않음).
# 이 url은 설치본의 app-update.yml에 들어가는 기본값이고, 실제로는 앱이 확인할 때마다 setFeedURL로 바꾼다. (Pi Desktop Mate와 같음)
publish:
  provider: generic
  url: https://github.com/skax-soulfactor/pi-desktop/releases/download/agent-v${version}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pi-Desktop-Agent-Setup-${version}.${ext}
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  artifactName: Pi-Desktop-Agent-${version}-${arch}.${ext}
  # Apple Developer ID가 없으므로 서명하지 않는다.
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  maintainer: skax-soulfactor
  syncDesktopName: true
  artifactName: Pi-Desktop-Agent-${version}-${arch}.${ext}
