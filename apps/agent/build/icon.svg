<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pi Desktop Agent 아이콘 원본. scripts/render-icon.mjs가 이것으로 build/icon.png(1024)를 만든다.
       Pi Desktop과 같은 π 붓질을 쓰되, 바탕은 청록 계열로, 커서 대신 승인 방패를 둬 두 앱을 구분한다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a33"/>
      <stop offset="0.55" stop-color="#0f4a52"/>
      <stop offset="1" stop-color="#138a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#5ff2d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ff2d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4fff6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04161a" flood-opacity="0.55"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 바탕: 둥근 사각형 -->
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#glow)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="210.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- π (Pi Desktop과 같은 붓질) -->
  <g filter="url(#soft)" fill="none" stroke="url(#pi)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 352 C 330 318, 420 310, 520 312 C 610 313, 690 318, 772 308" stroke-width="92"/>
    <path d="M 418 330 C 414 470, 392 600, 330 724" stroke-width="88"/>
    <path d="M 628 330 C 622 470, 620 600, 650 688 C 664 728, 700 742, 742 728" stroke-width="88"/>
  </g>

  <!-- 승인 방패와 체크 -->
  <g filter="url(#neon)" transform="translate(44 34)">
    <path d="M 790 640 L 880 676 L 880 758 C 880 822, 840 866, 790 888 C 740 866, 700 822, 700 758 L 700 676 Z" fill="url(#shield)"/>
    <path d="M 746 764 L 780 798 L 838 730" fill="none" stroke="#0f2a33" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
